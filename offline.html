<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zelix – Offline</title>
<style>
    :root { color-scheme: dark; }
    body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #0c0a09; color: #e7e5e4; font-family: -apple-system, 'Inter', sans-serif;
        text-align: center; padding: 24px; box-sizing: border-box;
    }
    h1 { color: #DC2626; letter-spacing: -0.05em; text-transform: uppercase; font-size: 1.6rem; margin-bottom: 8px; }
    p { color: #a8a29e; font-size: 0.9rem; line-height: 1.5; max-width: 340px; margin: 0 auto; }
    button {
        margin-top: 20px; background: #DC2626; color: #fff; border: none; padding: 12px 28px;
        border-radius: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em;
        cursor: pointer; font-size: 0.8rem;
    }
    button:active { transform: scale(0.97); }
</style>
</head>
<body>
<div>
    <h1>Zelix // Offline</h1>
    <p>Tuto stránku se ještě nepodařilo nikdy stáhnout, a teď není dostupné připojení k internetu.<br><br>Zkontroluj Wi-Fi / data a zkus to znovu.</p>
    <button onclick="location.reload()">Zkusit znovu</button>
</div>
</body>
</html>
